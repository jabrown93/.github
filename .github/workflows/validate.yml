name: Validate Renovate configuration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - renovate/**

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    container:
      image: renovate/renovate:44.221.5@sha256:ff73c6043e78a4fa0d32378bc2093e65fceb082a040d10db20add14ebe1c650a
      # Renovate image's unprivileged user cannot write runner command files.
      options: --user root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate repository configuration
        run: renovate-config-validator --strict
      - name: Validate shared presets
        run: |
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          for config in renovate-config.json renovate-semantic-release.json; do
            mkdir "$tmpdir/$config"
            cp "$config" "$tmpdir/$config/renovate.json"
            (cd "$tmpdir/$config" && renovate-config-validator --strict)
          done
