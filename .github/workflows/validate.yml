name: Validate Renovate configuration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - renovate/**

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    container:
      image: renovate/renovate:44.222.3@sha256:0d4a5af4e1d73308ddcba85928258444443bbd1ee5416978ecfe1465e41fc688
      # Renovate image's unprivileged user cannot write runner command files.
      options: --user root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate repository configuration
        run: renovate-config-validator --strict
      - name: Validate shared presets
        run: |
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          for config in renovate-config.json renovate-semantic-release.json; do
            mkdir "$tmpdir/$config"
            cp "$config" "$tmpdir/$config/renovate.json"
            (cd "$tmpdir/$config" && renovate-config-validator --strict)
          done
