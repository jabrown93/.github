name: Validate Renovate configuration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - renovate/**

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    container: renovate/renovate:44.178.1@sha256:e2ef0f770c9c469857070753a447f445da11822e2f3601a3763b1b2d1d069b9a
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - run: renovate-config-validator --strict renovate-config.json renovate-semantic-release.json renovate.json
